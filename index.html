<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ضفعه - النسخة النهائية</title>
<style>
    body {
        margin: 0;
        background: #121212;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Tahoma', sans-serif;
    }

    /* تحسين الانتقال */
    .view {
        transition: opacity 0.5s ease;
        opacity: 1;
        visibility: visible;
    }

    .hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    #start-screen {
        text-align: center;
        background: rgba(20, 20, 20, 0.95);
        padding: 40px;
        border-radius: 30px;
        border: 2px solid #5d4037;
        box-shadow: 0 0 40px rgba(139, 69, 19, 0.4);
        color: #d7ccc8;
        position: absolute;
        z-index: 2;
    }

    button {
        padding: 15px 30px;
        margin: 10px;
        font-size: 18px;
        cursor: pointer;
        background: #3e2723;
        color: white;
        border: 1px solid #8d6e63;
        border-radius: 15px;
        transition: 0.3s;
    }

    button:hover { background: #5d4037; transform: scale(1.05); }

    #game-container {
        position: absolute;
        width: 800px;
        height: 500px;
        border: 4px solid #5d4037;
        border-radius: 20px;
        box-shadow: 0 0 50px rgba(0,0,0,0.8);
        background: linear-gradient(-45deg, #2a1a15, #000000, #3e2723, #1a1a1a);
        background-size: 400% 400%;
        animation: bgMove 10s ease infinite;
        z-index: 1;
    }

    @keyframes bgMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    #frog {
        position: absolute;
        font-size: 60px;
        color: #fff;
        cursor: grab;
        user-select: none;
        touch-action: none;
        filter: drop-shadow(0 0 10px #ffab91) drop-shadow(0 0 20px #d84315);
        transition: filter 0.2s ease;
    }

    #frog.moving { filter: drop-shadow(0 0 15px #ffab91) blur(2px); }

    .controls {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: flex;
        gap: 10px;
        z-index: 10;
    }

    .small-btn { padding: 5px 15px; font-size: 12px; }
</style>
</head>
<body>

<div id="start-screen" class="view">
    <h1>اختر نمط العرض</h1>
    <button onclick="playSound(); setMode('mobile')">جوال</button>
    <button onclick="playSound(); setMode('pc')">كمبيوتر</button>
    <div id="start-btn-container" style="display:none; margin-top:20px;">
        <button onclick="playSound(); switchView('game-container')" style="background: #2e7d32;">بدء اللعبة</button>
    </div>
</div>

<div id="game-container" class="view hidden">
    <div class="controls">
        <button class="small-btn" onclick="playSound(); resetFrog()">إعادة</button>
        <button class="small-btn" onclick="playSound(); switchView('start-screen')">الرئيسية</button>
    </div>
    <div id="frog">ضفعه</div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 800; gain.gain.value = 0.1;
        osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
        osc.stop(audioCtx.currentTime + 0.1);
    }

    const container = document.getElementById("game-container");
    const startScreen = document.getElementById("start-screen");
    const frog = document.getElementById("frog");
    
    function switchView(target) {
        if (target === 'game-container') {
            startScreen.classList.add('hidden');
            setTimeout(() => { container.classList.remove('hidden'); resetFrog(); }, 500);
        } else {
            container.classList.add('hidden');
            setTimeout(() => { startScreen.classList.remove('hidden'); }, 500);
        }
    }

    function setMode(mode) {
        if(mode === 'mobile') {
            container.style.width = "350px"; container.style.height = "600px";
        } else {
            container.style.width = "800px"; container.style.height = "500px";
        }
        document.getElementById("start-btn-container").style.display = "block";
    }

    function resetFrog() {
        frog.style.left = (container.offsetWidth / 2 - 35) + "px";
        frog.style.top = (container.offsetHeight / 2 - 35) + "px";
    }

    let move = false, x, y;
    frog.addEventListener('pointerdown', e => {
        move = true; x = e.offsetX; y = e.offsetY;
        frog.style.cursor = "grabbing";
        frog.classList.add('moving');
    });

    window.addEventListener('pointerup', () => {
        move = false; frog.style.cursor = "grab";
        frog.classList.remove('moving');
    });

    window.addEventListener('pointermove', e => {
        if(!move) return;
        const rect = container.getBoundingClientRect();
        let newX = e.clientX - rect.left - x;
        let newY = e.clientY - rect.top - y;
        newX = Math.max(0, Math.min(newX, container.offsetWidth - 70));
        newY = Math.max(0, Math.min(newY, container.offsetHeight - 60));
        frog.style.left = newX + "px"; frog.style.top = newY + "px";
    });
</script>
</body>
</html>
